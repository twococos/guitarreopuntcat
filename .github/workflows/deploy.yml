# Construeix la imatge de producció i la publica a GitHub Container
# Registry. El servidor no rep cap connexió entrant: un cron seu fa
# polling d'aquest registre i s'actualitza sol (vegeu deploy/README.md).

name: Build i publica la imatge

on:
  push:
    branches: [main]
  # Permet llançar un build a mà des de la pestanya Actions.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/canconer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clona el repo
        uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autentica't a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos tags: `latest` és el que segueix el servidor, i el SHA del
      # commit permet tornar enrere a una versió concreta.
      - name: Calcula els tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construeix i publica
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre builds: sense això cada push recompila
          # better-sqlite3 i reinstal·la Chromium des de zero.
          cache-from: type=gha
          cache-to: type=gha,mode=max
